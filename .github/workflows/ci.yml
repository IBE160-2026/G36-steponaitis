name: CI

# Runs the same checks as local development (see README "Run locally") on every push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.13.8"

jobs:
  python:
    name: Python (ruff, import-linter, pytest on SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:py
      - run: npm run lint:imports
      - run: npm run test:py

  postgres:
    name: tests/app on Postgres 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --directory backend --locked
      - env:
          # The test asserts this dialect, so a dropped --database-url fails instead of passing on SQLite.
          SWP_EXPECT_DIALECT: postgresql
        run: >-
          uv run --directory backend --locked pytest tests/app
          --database-url postgresql://postgres:postgres@localhost:5432/swp_test

  frontend:
    name: Frontend (OpenAPI schema diff, ESLint, typecheck, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # npm ci's postinstall runs `uv sync`, so uv is needed here too.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # AD-13: frontend/lib/api/schema.ts must match the backend's OpenAPI schema.
      - run: npm run gen:api
      - run: git diff --exit-code -- frontend/lib/api/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:web

  e2e:
    name: End-to-end (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx --workspace frontend playwright install --with-deps chromium
      # Playwright builds and starts the production app itself through its webServer
      # (`npm run e2e:serve`: next build + next start, multi-worker backend; no reuse when CI is set).
      - run: npm run e2e -- --project=chromium
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
