name: Keep-alive

# Wakes the public deployment and its free Supabase database once a day, and checks that the
# deployment is still the public demo: GET /api/health runs SELECT 1 and must be answered by a
# function in `arn1` (Stockholm, next to the database; set by `regions` in vercel.json), GET
# /api/session must show FEATURE_AUTH and FEATURE_DEMO on, and POST /api/auth/demo (Demo version)
# must log in as `demo`.
# Demo version writes nothing while the `demo` row exists. A failed step fails the run, and
# GitHub emails the owner.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Named explicitly, so GitHub runs it with `-eo pipefail`: a failed curl fails the step even
    # though jq is the last command of the pipe. Each jq filter prints the checked fields first,
    # so the log shows what was off; its last output, the boolean, decides `--exit-status`.
    shell: bash

env:
  PUBLIC_URL: https://g36steponaitis.vercel.app

jobs:
  health:
    name: Health, flags and Demo version on the public URL
    runs-on: ubuntu-latest
    # Three steps, each at most 4 tries of 30 s with 10 s between them (150 s).
    timeout-minutes: 10
    steps:
      - name: GET /api/health answers 2xx from a function in arn1
        # `x-vercel-id` is `<edge region>::<function region>::<request id>`. A missing header or
        # any other function region (Vercel's default is `iad1`) fails the step.
        run: |
          headers="$(mktemp)"
          curl --fail --retry 3 --retry-delay 10 --retry-all-errors --silent --show-error --max-time 30 --dump-header "$headers" "$PUBLIC_URL/api/health"
          echo
          id="$(tr -d '\r' < "$headers" | awk 'tolower($1) == "x-vercel-id:" { id = $2 } END { print id }')"
          echo "x-vercel-id: ${id:-missing}"
          region="$(awk -F '::' '{ print $2 }' <<< "$id")"
          [ "$region" = "arn1" ]
      - name: GET /api/session shows FEATURE_AUTH and FEATURE_DEMO on and no user
        run: >-
          curl --fail --retry 3 --retry-delay 10 --retry-all-errors --silent --show-error --max-time 30
          "$PUBLIC_URL/api/session"
          | jq --exit-status --compact-output
          '{feature_auth, feature_demo, user}, (.feature_auth == true and .feature_demo == true and .user == null)'
      - name: POST /api/auth/demo logs in as demo
        run: >-
          curl --fail --retry 3 --retry-delay 10 --retry-all-errors --silent --show-error --max-time 30
          --request POST --header "Origin: $PUBLIC_URL"
          "$PUBLIC_URL/api/auth/demo"
          | jq --exit-status --compact-output '{user}, (.user == "demo")'
