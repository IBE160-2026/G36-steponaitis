# Team overrides for bmad-build-auto (committed).
# Project facts for the unattended build loop, decided by the user on 2026-11-19.
# Subagents do not see Claude's personal memory, so the rules live here.

[workflow]

persistent_facts = [
  "Branch: all work happens directly on `main` (user decision 2026-11-19). `main` is the correct branch for every story; never create a feature branch and never HALT for a branch mismatch because the branch is `main`.",
  "Deployment is deferred (user decision 2026-11-19): never deploy, never run the Vercel CLI, never create or contact Vercel or Supabase resources, never set production secrets. Epic 16 (Go live on the public URL) is out of scope for the unattended run. Everything is built and verified locally.",
  "Data: only synthetic data. Never read, copy or use `data/private/` or any real company export. Tests, fixtures and seeds use `data/sample/` (generated by `data/generate_demo_data.py`) and `data/answer-key/` only, and never edit those two folders.",
  "Vertical slices with a shared kernel: each epic's code lives in its own slice (domain module, app service, API router, frontend module, tests) as the epics file's 'Epic Design: Vertical Slices with a Shared Kernel' section says; code used by two or more slices moves to the shared kernel or common folders in the story that needs it (DRY). A frontend module never imports another module, and a domain slice imports only the domain kernel plus the listed exceptions.",
  "The architecture spine (`.docs/planning-artifacts/architecture/architecture-Project-2026-11-16/ARCHITECTURE-SPINE.md`) is binding, including the pinned versions in its Stack table. `architecture/technology.md` is a reference from another project and is not binding.",
  "Every test names the FR or NFR it covers (SM-7), for example `test_fr26_partner_with_recommendation_waits`. The UI, code, comments and docs are in English.",
  "Subagents in this host: the Agent tool may return at once and deliver the subagent's result later as a task notification. Waiting for that notification within the same run is the expected blocking behaviour here, not a detached run. Launch all of a step's subagents in one message, wait for every result, then continue. Never HALT with `no subagents` for this reason.",
  "End-to-end tests (user decision 2026-11-21): every story that changes something a user can see or do adds or extends a Playwright test in `frontend/e2e/` that walks the story's user journey through the real UI (the journeys UJ-1–UJ-8 are in `.docs/planning-artifacts/ux-designs/ux-Project-2026-11-11/EXPERIENCE.md`; name the journey in the test, e.g. `uj1 imports the sample files`). The test asserts the visible result, not only that the page loads. Verification for such a story includes `npx playwright test --project=chromium` passing. A story with no user-visible change (pure backend, tooling) needs no new Playwright test but must keep the existing ones green.",
  "CI runs Playwright (user decision 2026-11-21): `ci.yml` has an `e2e` job that installs Chromium (`npx playwright install --with-deps chromium`), starts the app the same way the Playwright config does, and runs `npx playwright test --project=chromium`. Until the first e2e test exists the job passes with `--pass-with-no-tests`. Playwright reports, traces and screenshots are uploaded as artifacts when the job fails.",
  "Session logs: the orchestrating session writes the `sesjonslogg` log after each story. A build-auto run does not write session logs itself and does not push.",
]
