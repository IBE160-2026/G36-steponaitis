[project]
name = "swp"
version = "0.1.0"
description = "Smart Warehouse Planner backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
    "python-multipart==0.0.34",
    "bcrypt==5.0.0",
    "PyJWT==2.15.1",
]

[project.scripts]
swp = "swp.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.2",
    "ruff==0.17.5",
    "import-linter==2.16",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]

[tool.pytest.ini_options]
testpaths = ["tests"]
