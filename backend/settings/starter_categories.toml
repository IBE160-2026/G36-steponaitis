# Starter keyword rules and aisle categories for the demo data (FR-47, AD-9).
#
# Synthetic data only (NFR-4): drafted by AI (Claude Code) only from the synthetic part
# descriptions and aisles in data/sample/; awaiting the author's check (Story 13.4 AC 1).
#
# `swp db upgrade` (and the local lifespan) loads this file once, only when both the
# keyword_rules and aisle_categories tables are empty; it never overwrites the planner's lists.
# Rules are in order: the first rule whose keyword is a whole word of the part description
# gives the category ("Oil filter" is a filter because `filter` comes before `oil`).

[[rules]]
keyword = "filter"
category = "Filters"

